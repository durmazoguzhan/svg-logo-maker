       The wordmark x is 520 rather than 528 because "l" carries a side bearing;
       optical alignment is about where the ink starts, not where the box does.
       Baseline 280 puts the wordmark's optical centre on the icon's, at 256.
       Both were measured with inkscape query-id, not estimated. -->

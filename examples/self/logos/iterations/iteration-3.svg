<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 512">
  <!-- Frame: icon 48-464, one 64 gap, wordmark ink 528-1024, right margin 48.
       The wordmark x is 520 rather than 528 because "l" carries a side bearing;
       optical alignment is about where the ink starts, not where the box does.
       Baseline 280 puts the wordmark's optical centre on the icon's, at 256.
       Both were measured with inkscape query-id, not estimated. -->
  <g id="icon" fill="#18181b" fill-rule="evenodd">
    <!-- Constant gap (16), shrinking square (192, 120, 72 — a steady 1.6).
         Corner radius is 0.22 of the side on all three, so they read as one
         family. The counter is cut, never tinted, so it holds in one ink. -->
    <path d="M48 90a42 42 0 0 1 42-42h108a42 42 0 0 1 42 42v108a42 42 0 0 1-42 42H90a42 42 0 0 1-42-42z
             M108 124v40a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16v-40a16 16 0 0 0-16-16h-40a16 16 0 0 0-16 16z"/>
    <rect x="256" y="256" width="120" height="120" rx="26"/>
    <rect x="392" y="392" width="72" height="72" rx="16"/>
  </g>
  <g id="wordmark">
    <!-- live text is the master; outline.sh converts it at delivery -->
    <text x="520" y="280" font-family="DejaVu Sans, Verdana, sans-serif"
          font-size="90" font-weight="700" letter-spacing="-4" fill="#18181b">logomaker</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 384">
  <!-- Combination mark. The cascade says one drawing, three sizes — which is
       what the skill does — so the rationale is about the product, not the
       shape (invariant 6). -->
  <g id="icon" fill="#18181b" transform="translate(0,-64) scale(0.875)">
    <!-- counter is cut, never tinted, so it holds in a single ink -->
    <path d="M64 112a48 48 0 0 1 48-48h128a48 48 0 0 1 48 48v128a48 48 0 0 1-48 48H112a48 48 0 0 1-48-48z
             M136 156v40a20 20 0 0 0 20 20h40a20 20 0 0 0 20-20v-40a20 20 0 0 0-20-20h-40a20 20 0 0 0-20 20z"
          fill-rule="evenodd"/>
    <rect x="304" y="224" width="144" height="144" rx="32"/>
    <rect x="368" y="400" width="80" height="80" rx="18"/>
  </g>
  <g id="wordmark">
    <!-- live text is the master; outline.sh converts it at delivery -->
    <text x="472" y="216" font-family="DejaVu Sans, Verdana, sans-serif"
          font-size="88" font-weight="700" letter-spacing="-3" fill="#18181b">logomaker</text>
  </g>
</svg>

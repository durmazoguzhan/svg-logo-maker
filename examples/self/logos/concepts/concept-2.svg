<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Aperture: a regular series broken once. The dot is the focus because
       solidity beats area (invariant 3), not because it is large. -->
  <g id="icon" fill="none" stroke="#18181b" stroke-width="32" stroke-linecap="butt">
    <!-- ring opened at the top right; the gap is the idea, keep it wide -->
    <path d="M256 80a176 176 0 1 0 124.5 51.5"/>
  </g>
  <g fill="#18181b">
    <circle cx="256" cy="256" r="64"/>
  </g>
</svg>
